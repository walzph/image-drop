schemaVersion: v0.2
prepare:
  steps:
    - command: sudo n install 22
    - command: sudo npm install -g @anthropic-ai/claude-code
    - command: npm install
    - command: npm run build:frontend
test:
  steps: []
run:
  production:
    steps:
      - command: sudo n install 22
      - command: npm run start:production
    plan: 9
    replicas: 1
    isPublic: true
    network:
      path: /
      stripPath: false
